
<main class="auth-container">

  <div class="auth-card foro-card">

    <div class="text-center mb-4">

      <div class="auth-logo">
        <i class="bi bi-mortarboard-fill"></i>
      </div>

      <h2>Foro</h2>

      <p class="text-secondary">
        Iniciar sesión
      </p>

    </div>

    <form (ngSubmit)="iniciarSesion()">

      @if (error) {
        <div class="alert alert-danger">
          {{ error }}
        </div>
      }

      <div class="mb-3">
        <label class="form-label">Usuario</label>

        <input type="text"
              class="form-control"
              name="usuario"
              [(ngModel)]="usuario"
              required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>

        <input type="password"
              class="form-control"
              name="password"
              [(ngModel)]="password"
              required>
      </div>

      <button type="submit"
              class="btn btn-primary w-100"
              [disabled]="cargando">

        @if (cargando) {
          <span class="spinner-border spinner-border-sm me-1"></span>
          Ingresando...
        } @else {
          Iniciar sesión
        }

      </button>

    </form>

    <div class="text-center mt-4">
      <span class="text-secondary">
        ¿Aún no tienes una cuenta?
      </span>

      <a routerLink="/registro" class="fw-semibold ms-1">
        Regístrate
      </a>
    </div>


    <div class="card mt-4 border shadow-sm">
      <div class="card-body p-3">

        <h6 class="mb-3">
          Usuario de prueba
        </h6>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="text-secondary small">Usuario</span>
          <code class="fw-semibold">belen_g</code>
        </div>

        <div class="d-flex justify-content-between align-items-center">
          <span class="text-secondary small">Contraseña</span>
          <code class="fw-semibold">pass1</code>
        </div>

      </div>
    </div>

  </div>

  <div class="text-center mt-4">
    <a routerLink="/" class="text-secondary small">
      <i class="bi bi-arrow-left"></i>
      Volver al inicio
    </a>
  </div>

</main>
